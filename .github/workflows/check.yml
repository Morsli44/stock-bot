name: check-stock
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
permissions:
  actions: write
concurrency:
  group: stock-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - run: python stock_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Restart itself
        if: always()
        run: gh workflow run check.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
